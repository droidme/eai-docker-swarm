# Traefik static configuration file (/etc/traefik/traefik.yml)
# See https://doc.traefik.io/traefik/getting-started/configuration-overview/#the-static-configuration
# and https://doc.traefik.io/traefik/reference/static-configuration/cli/

global:
  checknewversion: false                      # Periodically check if a new version has been released.
  sendanonymoususage: false                   # Periodically send anonymous usage statistics.

log:
  level: "DEBUG"                              # Log level (DEBUG, INFO, WARN, ERROR, FATAL, PANIC)
  filePath: "/var/log/traefik.log"               # Log file path
  

api:
  dashboard: true                             # Enable the dashboard
  insecure: true                              # Enable the insecure API (not recommended for production)
  debug: true                                 # Enable the debug API

entryPoints:
  web:
    address: :80                              # Create the HTTP entrypoint on port 80
    # --> (Optional) Redirect all HTTP to HTTPS
    # http:
    #   redirections:
    #     entryPoint:
    #       to: websecure
    #       scheme: https
    # <--
  websecure:
    address: :443                             # Create the HTTPS entrypoint on port 443

providers:
  swarm:
    endpoint: unix:///var/run/docker.sock
    watch: true                              # Watch for changes in the Docker socket
    exposedByDefault: false                  # Do not expose all containers by default
    network: eai-network                     # Use the traefik-net network

metrics:
  prometheus:
    entryPoint: web
    addEntryPointsLabels: true                # Add labels for entry points
    addServicesLabels: true                   # Add labels for services