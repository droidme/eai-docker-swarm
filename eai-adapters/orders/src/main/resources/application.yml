server:
  port: 8080

spring:
  application:
    name: eai-adapter-orders

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

camel:
  component:
    micrometer:
      enabled: true

logging:
  level:
    org.apache.camel: INFO
    com.example.eai: DEBUG
