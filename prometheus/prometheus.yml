global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'eai-swarm'
    environment: 'production'

rule_files:
  - "/etc/prometheus/alerts/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Prometheus selbst überwachen
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Traefik Metriken
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8080']
    metrics_path: /metrics
    scrape_interval: 15s

  # EAI Adapters via Docker Swarm Service Discovery
  - job_name: 'eai-adapters-swarm'
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: tasks
        port: 8080
        refresh_interval: 30s
    relabel_configs:
      # Nur Services mit prometheus.scrape=true Label scrapen
      - source_labels: [__meta_dockerswarm_service_label_prometheus_scrape]
        regex: true
        action: keep
      # EAI Stack Services filtern
      - source_labels: [__meta_dockerswarm_service_name]
        regex: 'eai-stack_eai-adapter-.*'
        action: keep
      # Service Name als Job Label
      - source_labels: [__meta_dockerswarm_service_name]
        target_label: job
        regex: 'eai-stack_(.*)'
        replacement: '${1}'
      # Task Name als Instance Label
      - source_labels: [__meta_dockerswarm_task_name]
        target_label: instance
      # Adapter Type Label hinzufügen
      - source_labels: [__meta_dockerswarm_service_label_eai_adapter_type]
        target_label: adapter_type
      # Adapter Version Label hinzufügen
      - source_labels: [__meta_dockerswarm_service_label_eai_adapter_version]
        target_label: adapter_version
      # Metriken-Pfad aus Label setzen
      - source_labels: [__meta_dockerswarm_service_label_prometheus_path]
        target_label: __metrics_path__
        regex: (.+)
        replacement: '${1}'
      # Default Metriken-Pfad falls Label nicht gesetzt
      - target_label: __metrics_path__
        replacement: /actuator/prometheus
    scrape_interval: 30s
    scrape_timeout: 10s

  # Monitoring Stack Services
  - job_name: 'monitoring-stack'
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: tasks
        refresh_interval: 30s
    relabel_configs:
      # Nur Monitoring Stack Services
      - source_labels: [__meta_dockerswarm_service_label_monitoring_stack]
        regex: true
        action: keep
      # Service Name als Job Label
      - source_labels: [__meta_dockerswarm_service_name]
        target_label: job
        regex: 'monitoring-stack_(.*)'
        replacement: 'monitoring-${1}'
      - source_labels: [__meta_dockerswarm_task_name]
        target_label: instance

  # Node Exporter für System-Metriken
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s
    metrics_path: /metrics

  # Statische Fallback-Konfiguration für EAI Adapter
  - job_name: 'eai-adapter-sample-static'
    static_configs:
      - targets: ['eai-adapter-sample:8080']
        labels:
          adapter_type: 'sample'
          stack: 'eai'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 30s

  - job_name: 'eai-adapter-orders-static'
    static_configs:
      - targets: ['eai-adapter-orders:8080']
        labels:
          adapter_type: 'orders'
          stack: 'eai'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 30s

  - job_name: 'eai-adapter-products-static'
    static_configs:
      - targets: ['eai-adapter-products:8080']
        labels:
          adapter_type: 'products'
          stack: 'eai'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 30s
