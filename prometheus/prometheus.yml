global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'eai-swarm'
    environment: 'production'

rule_files:
  - "/etc/prometheus/alerts/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # Prometheus selbst überwachen
  - job_name: 'prometheus'
    static_configs:
      - targets: [ 'monitoring_prometheus:9090' ]
    metrics_path: /metrics
    scrape_interval: 15s

  # Traefik Metriken
  - job_name: 'traefik'
    static_configs:
      - targets: [ 'infrastructure_traefik:8080' ]
    metrics_path: /metrics
    scrape_interval: 15s

  # EAI Adapters via Docker Swarm Service Discovery
  # https://prometheus.io/docs/guides/dockerswarm/
  # https://prometheus.io/docs/prometheus/latest/configuration/configuration/#dockerswarm_sd_config
  - job_name: 'eai'
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: tasks
        port: 8080
        refresh_interval: 30s
    relabel_configs:
      # Only keep containers that should be running.
      - source_labels: [ __meta_dockerswarm_task_desired_state ]
        regex: running
        action: keep
      # Nur Services mit prometheus.scrape=true Label scrapen
      - source_labels: [ __meta_dockerswarm_service_label_prometheus_scrape ]
        regex: true
        action: keep
      # Nur Services mit prometheus.scrape.group=eai Label scrapen
      - source_labels: [ __meta_dockerswarm_service_label_prometheus_scrape_group ]
        regex: eai
        action: keep
      # Service Name als Job Label
      - source_labels: [ __meta_dockerswarm_service_name ]
        target_label: job
        regex: 'eai_(.*)'
        replacement: '${1}'
      # Task Name als Instance Label
      - source_labels: [ __meta_dockerswarm_task_name ]
        target_label: instance
      # Metriken-Pfad aus Label setzen
      - source_labels: [ __meta_dockerswarm_service_label_prometheus_path ]
        target_label: __metrics_path__
        regex: (.+)
        replacement: '${1}'
      # Default Metriken-Pfad falls Label nicht gesetzt
      #- target_label: __metrics_path__
      #  replacement: /actuator/prometheus
    scrape_interval: 30s
    scrape_timeout: 10s

  # Node Exporters via Docker Swarm Service Discovery
  # https://prometheus.io/docs/guides/dockerswarm/
  # https://prometheus.io/docs/prometheus/latest/configuration/configuration/#dockerswarm_sd_config
  - job_name: 'node-exporters'
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: tasks
        port: 8080
        refresh_interval: 30s
    relabel_configs:
      # Only keep containers that should be running.
      - source_labels: [ __meta_dockerswarm_task_desired_state ]
        regex: running
        action: keep
      # Nur Services mit prometheus.scrape=true Label scrapen
      - source_labels: [ __meta_dockerswarm_service_label_prometheus_scrape ]
        regex: true
        action: keep
      # Nur Services mit prometheus.scrape.group=node-exporter Label scrapen
      - source_labels: [ __meta_dockerswarm_service_label_prometheus_scrape_group ]
        regex: node-exporter
        action: keep