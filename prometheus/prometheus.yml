global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'traefik'
    static_configs:
      - targets: ['localhost:80']
    metrics_path: /metrics

  - job_name: 'eai-adapters'
    static_configs:
      - targets: ['eai-adapter-sample:8080', 'eai-adapter-orders:8080']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 30s
