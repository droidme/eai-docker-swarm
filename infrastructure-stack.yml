version: '3.8'

services:
  # Traefik Reverse Proxy
  traefik:
    image: traefik:v3.0
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Traefik Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-data:/data
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - eai-network
      - monitoring-network
      - traefik-network
    deploy:
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.http.routers.traefik.rule=Host(`traefik.localhost`)
        - traefik.http.services.traefik.loadbalancer.server.port=8080
        - traefik.http.routers.traefik.service=api@internal
        - infrastructure.stack=true
        - infrastructure.component=reverse-proxy
      replicas: 1
      update_config:
        parallelism: 1
        delay: 30s
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3

  # Portainer Container Management
  portainer:
    image: portainer/portainer-ce:latest
    command: --admin-password='admin'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer-data:/data
    networks:
      - traefik-network
    deploy:
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.http.routers.portainer.rule=Host(`portainer.localhost`)
        - traefik.http.services.portainer.loadbalancer.server.port=9000
        - infrastructure.stack=true
        - infrastructure.component=container-management
        - prometheus.scrape=false
      replicas: 1
      update_config:
        parallelism: 1
        delay: 30s
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3

networks:
  eai-network:
    external: true
  monitoring-network:
    external: true
  traefik-network:
    driver: overlay
    attachable: true

volumes:
  traefik-data:
    driver: local
  portainer-data:
    driver: local
