global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alertmanager@eai-system.local'
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'web.hook'
  routes:
  - match:
      severity: critical
    receiver: 'critical-alerts'
  - match:
      severity: warning
    receiver: 'warning-alerts'

receivers:
- name: 'web.hook'
  webhook_configs:
  - url: 'http://webhook-handler:5001/alerts'
    send_resolved: true

- name: 'critical-alerts'
  email_configs:
  - to: 'ops-team@company.com'
    subject: 'CRITICAL: EAI System Alert'
    body: |
      Alert: {{ .GroupLabels.alertname }}
      Description: {{ range .Alerts }}{{ .Annotations.description }}{{ end }}
      Details: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}
  webhook_configs:
  - url: 'http://webhook-handler:5001/critical'
    send_resolved: true

- name: 'warning-alerts'
  email_configs:
  - to: 'dev-team@company.com'
    subject: 'WARNING: EAI System Alert'
    body: |
      Alert: {{ .GroupLabels.alertname }}
      Description: {{ range .Alerts }}{{ .Annotations.description }}{{ end }}

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']
