# Global EAI Configuration
eai:
  global:
    cluster:
      name: "eai-swarm-cluster"
      environment: "production"
    
    monitoring:
      enabled: true
      prometheus:
        scrape_interval: 30s
        metrics_path: "/actuator/prometheus"
      
    security:
      basic_auth:
        enabled: false
        username: "admin"
        password: "admin"
      
    logging:
      level:
        root: INFO
        org.apache.camel: INFO
        com.example.eai: DEBUG
    
    camel:
      context:
        name: "EAI-Global-Context"
        shutdown_timeout: 30s
      
      routes:
        startup_order_enabled: true
        auto_startup: true
        
      error_handler:
        type: "dead_letter_channel"
        dead_letter_uri: "direct:global-error"
        maximum_redeliveries: 3
        redelivery_delay: 1000
        
      thread_pool:
        core_pool_size: 10
        maximum_pool_size: 50
        keep_alive_time: 60s
        
    redis:
      connection:
        host: "redis"
        port: 6379
        password: "eai-redis-password"
        database: 0
        timeout: 5000ms
        
    database:
      config:
        url: "jdbc:postgresql://config-db:5432/eai_config"
        username: "eai_admin"
        password_file: "/run/secrets/config_db_password"
        connection_pool:
          minimum_idle: 5
          maximum_pool_size: 20
          connection_timeout: 30000
          
  adapters:
    defaults:
      health_check:
        enabled: true
        path: "/actuator/health"
        interval: 30s
        
      metrics:
        enabled: true
        prometheus:
          enabled: true
          path: "/actuator/prometheus"
          
      management:
        endpoints:
          web:
            exposure:
              include: "health,info,metrics,prometheus,camel"
            
      jvm:
        memory:
          heap_size: "512m"
          initial_heap_size: "256m"
        gc:
          collector: "G1GC"
          
      spring:
        profiles:
          active: "swarm"
          
        datasource:
          hikari:
            maximum_pool_size: 10
            minimum_idle: 2
            connection_timeout: 20000
            
        jackson:
          serialization:
            write_dates_as_timestamps: false
            
        actuator:
          health:
            show_details: "always"
            show_components: true
